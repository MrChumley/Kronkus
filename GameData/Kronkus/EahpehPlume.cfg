// Localized cryovolcano plume and rift vapor on Eahpeh, for Blackrack
// EVE-Redux / Volumetric Clouds Release 5. Eahpeh is airless; EVE clouds
// do not need an atmosphere. Coverage is generated from the blue
// cryovolcano and rift painted in Kronkus/Textures/Eahpeh_Color.dds
// and stored as two vertically flipped BC4U maps (EVE's OnDemand
// DDS convention), mask in R. The painted features match Eahpeh's
// Seeping Blue biome and color map (volcano and rift). EVE's
// cloud sphere is 180° off in longitude from that Kopernicus
// layout, so offset = 0,180,0 (static, degrees about the polar
// axis) places the frost on those features. speed and
// detailSpeed stay zero so it does not drift. There is no
// upward volume flow. The frost is an icy lavender, tinted to
// Kronkus's purple bands. Detail and UV noise are referenced from
// StockVolumetricClouds by path only; this pack does not bundle
// any V5 files.
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements,StockVolumetricClouds]
{
	OBJECT
	{
		name = Eahpeh-plume
		body = Eahpeh
		// 2D orbit layer sits mid-plume.
		altitude = 2500
		// Tidally locked frost: stay fixed over the volcano. EVE
		// treats speed as linear m/s of the coverage map, so any
		// non-zero value walks the plume around the moon over time.
		// offset is in degrees; 180 about Y corrects EVE's longitude
		// vs the Kopernicus color/biome maps.
		speed = 0,0,0
		detailSpeed = 0,0,0
		offset = 0,180,0
		settings
		{
			_DetailTex = StockVolumetricClouds/Clouds/Textures/PluginData/detail1
			_DetailScale = 30
			_UVNoiseTex = StockVolumetricClouds/Clouds/Textures/PluginData/uvnoise1
			_UVNoiseScale = 0.2
			// Icy lavender, tinted to Kronkus's purple bands; still translucent.
			_Color = 188,158,228,200
			_Lambertian = 0.5
			_MainTex
			{
				value = Kronkus/Textures/PluginData/Eahpeh_PlumeCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			_FlowMap
			{
			}
		}
		layerRaymarchedVolumeV5
		{
			upwardsCloudSpeed = 0
			// Eahpeh radius is 78 km. Keep volumetrics in low orbit,
			// then fade to the 2D layer for map view and higher passes.
			scaledFadeStartAltitude = 18000
			scaledFadeEndAltitude = 40000
			color = 188,158,228,255
			skylightMultiplier = 0.8
			skylightTintMultiplier = 0.5
			noise
			{
				erosionDepth = 0.5
				worley
				{
					spherical = 1
					persistence = 0.5
				}
			}
			coverageMap
			{
				value = Kronkus/Textures/PluginData/Eahpeh_PlumeCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			raymarchingSettings
			{
				lightMarchSteps = 4
				lightMarchDistance = 600
				baseStepSize = 25
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 400
			}
			cloudTypes
			{
				Item
				{
					typeName = Plume
					// Surface to 5 km, scaled to the 78 km moon.
					// Terrain deformity is 2.7 km; interpolate so the
					// column sits on the ground and rises above it.
					minAltitude = 0
					maxAltitude = 5000
					interpolateCloudHeights = true
					baseNoiseTiling = 600
					// A bit denser than the rift vapor so the main plume reads clearly.
					density = 0.009
					ambientVolume = 2
					dropletsDensity = 0
					noiseEdgeHardness = 0.9
					lightningFrequency = 0
					coverageCurve
					{
						key = 0.0 1.0 0 0
						key = 0.55 0.85 -0.5 -0.5
						key = 1.0 0.02 -0.2 -0.2
					}
					densityCurve
					{
						key = 0.0 0.7 0 0
						key = 0.25 1.0 0 0
						key = 1.0 0.15 -0.5 -0.5
					}
				}
			}
			lightVolumeSettings
			{
			}
			phaseFunctions
			{
				singleScattering1 = 0.7, 0.08
				singleScattering2 = 0.3, 0.15
				multipleScattering1 = 0.2, 2.0
				multipleScattering2 = -0.2, 0.25
			}
		}
		layer2D
		{
			shadowMaterial
			{
				_ShadowFactor = 0.4
			}
			macroCloudMaterial
			{
				_FalloffPow = 2
				_FalloffScale = 3
				_DetailDist = 2E-06
				_RimDist = 0.0001
				_RimDistSub = 1.01
				_InvFade = 0.008
			}
		}
	}
	OBJECT
	{
		name = Eahpeh-fissure
		body = Eahpeh
		// Low 2D ribbon so the rift still reads from orbit and map view.
		altitude = 800
		speed = 0,0,0
		detailSpeed = 0,0,0
		offset = 0,180,0
		settings
		{
			_DetailTex = StockVolumetricClouds/Clouds/Textures/PluginData/detail1
			_DetailScale = 30
			_UVNoiseTex = StockVolumetricClouds/Clouds/Textures/PluginData/uvnoise1
			_UVNoiseScale = 0.2
			// Softer lavender wisp, same family as the plume, still see-through.
			_Color = 172,148,216,120
			_Lambertian = 0.5
			_MainTex
			{
				value = Kronkus/Textures/PluginData/Eahpeh_FissureCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			_FlowMap
			{
			}
		}
		layerRaymarchedVolumeV5
		{
			upwardsCloudSpeed = 0
			scaledFadeStartAltitude = 18000
			scaledFadeEndAltitude = 40000
			color = 172,148,216,255
			skylightMultiplier = 0.7
			skylightTintMultiplier = 0.5
			noise
			{
				erosionDepth = 0.45
				worley
				{
					spherical = 1
					persistence = 0.5
				}
			}
			coverageMap
			{
				value = Kronkus/Textures/PluginData/Eahpeh_FissureCoverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			raymarchingSettings
			{
				lightMarchSteps = 4
				lightMarchDistance = 400
				baseStepSize = 20
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 300
			}
			cloudTypes
			{
				Item
				{
					typeName = FissureVapor
					// Thin, low vapor venting along the rift, about 1.8 km tall.
					minAltitude = 0
					maxAltitude = 1800
					interpolateCloudHeights = true
					baseNoiseTiling = 400
					density = 0.003
					ambientVolume = 2
					dropletsDensity = 0
					noiseEdgeHardness = 0.92
					lightningFrequency = 0
					coverageCurve
					{
						key = 0.0 1.0 0 0
						key = 0.35 0.7 -1 -1
						key = 1.0 0.0 -0.2 -0.2
					}
					densityCurve
					{
						key = 0.0 1.0 0 0
						key = 1.0 0.2 -0.5 -0.5
					}
				}
			}
			lightVolumeSettings
			{
			}
			phaseFunctions
			{
				singleScattering1 = 0.7, 0.08
				singleScattering2 = 0.3, 0.15
				multipleScattering1 = 0.2, 2.0
				multipleScattering2 = -0.2, 0.25
			}
		}
		layer2D
		{
			shadowMaterial
			{
				_ShadowFactor = 0.25
			}
			macroCloudMaterial
			{
				_FalloffPow = 2
				_FalloffScale = 3
				_DetailDist = 2E-06
				_RimDist = 0.0001
				_RimDistSub = 1.01
				_InvFade = 0.008
			}
		}
	}
}
