// Kersex cloud deck for Blackrack EVE-Redux / Volumetric Clouds Release 5.
// Faithful conversion of the 2015 EVE layer (bluish-grey 102,122,153 at 7 km).
// The original coverage was BoulderCo/Textures/cube, which is not shipped
// with V5 and was never a Kronkus-owned texture. Coverage is remapped to
// the Laythe base map (closest stock analog: an ocean moon). Detail, UV
// noise, droplets, and wind sound are referenced from StockVolumetricClouds
// by path only; this pack does not bundle any V5 files.
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements,StockVolumetricClouds]
{
	OBJECT
	{
		name = Kersex-clouds1
		body = Kersex
		// 2D orbit layer stays at the original 7 km deck height.
		altitude = 7000
		// Drift from the v1.1/v1.2 Kersex config; detail scroll unchanged.
		speed = 0,30,0
		detailSpeed = 0,6,0
		settings
		{
			_DetailTex = StockVolumetricClouds/Clouds/Textures/PluginData/detail1
			_DetailScale = 30
			_UVNoiseTex = StockVolumetricClouds/Clouds/Textures/PluginData/uvnoise1
			_UVNoiseScale = 0.2
			_Color = 102,122,153,255
			_Lambertian = 0.5
			_MainTex
			{
				value = StockVolumetricClouds/Clouds/Textures/PluginData/Laythe/base/coverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			_FlowMap
			{
			}
		}
		layerRaymarchedVolumeV5
		{
			upwardsCloudSpeed = 5
			// Kersex radius 437 km, atmosphere 80 km. Keep volumetrics
			// in a typical low orbit, then fade to the 2D layer so the
			// deck still reads from high orbit without a hard pop.
			scaledFadeStartAltitude = 150000
			scaledFadeEndAltitude = 220000
			color = 102,122,153,255
			skylightMultiplier = 1.0
			skylightTintMultiplier = 0.7
			noise
			{
				erosionDepth = 0.65
				worley
				{
					spherical = 1
					persistence = 0.57
				}
			}
			coverageMap
			{
				value = StockVolumetricClouds/Clouds/Textures/PluginData/Laythe/base/coverage
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			raymarchingSettings
			{
				lightMarchSteps = 4
				lightMarchDistance = 1200
				baseStepSize = 75
				adaptiveStepSizeFactor = 0.006
				maxStepSize = 1500
			}
			cloudTypes
			{
				Item
				{
					typeName = CloudDeck
					// 5 km band centered on the original 7 km altitude.
					// Kersex peaks reach about 7.2 km, so some summits
					// will poke into the deck.
					minAltitude = 4500
					maxAltitude = 9500
					interpolateCloudHeights = true
					baseNoiseTiling = 2300
					density = 0.006
					ambientVolume = 2
					dropletsDensity = 0.2
					noiseEdgeHardness = 0.97
					lightningFrequency = 0
					coverageCurve
					{
						key = 0.01728953 -0.004032524 1.633945 1.633945
						key = 0.08695792 0.976166 0.06669102 0.04846065
						key = 0.9732781 -0.006797761 -0.7966601 -0.5550035
					}
					densityCurve
					{
						key = 0 0 1 1
						key = 1 1 1 1
					}
				}
			}
			ambientSound
			{
				soundName = StockVolumetricClouds/Clouds/Sounds/WhistlingWindLooped
			}
			droplets
			{
				dropletsConfig = droplets-cloud-Kerbin
			}
			lightVolumeSettings
			{
			}
			phaseFunctions
			{
				singleScattering1 = 0.95, 0.05
				singleScattering2 = 0.8, 0.1
				multipleScattering1 = 0.2, 2.0
				multipleScattering2 = -0.4, 0.20
			}
		}
		layer2D
		{
			shadowMaterial
			{
				_ShadowFactor = 1
			}
			macroCloudMaterial
			{
				_FalloffPow = 2
				_FalloffScale = 3
				_DetailDist = 2E-06
				_RimDist = 0.0001
				_RimDistSub = 1.01
				_InvFade = 0.008
			}
		}
	}
}
